# TCGA-LUSC RNA-only control on the same 28 CT-paired labelled cases.

modalities:
  - type: transcriptomics
    path: /home/author/work/agents/shared/qml_in_multiomics/data/tcga_lusc/rnaseq_tpm.csv
    modality: transcriptomics
    log1p: true
    top_var_genes: 2000

labels:
  path: /home/author/work/agents/shared/qml_in_multiomics/data/tcga_lusc/labels_ct_rna_usable.csv
  id_column: case_id
  label_column: label

run:
  models:
    logreg: {}
    svm_rbf: {}
    gbdt: {}
    qsvm_fidelity: {}
  n_splits: 5
  seed: 42
  normalize: zscore
  encoding_scale: pi
  select_k: 10
  selector: gbdt
