# CPTAC-LUAD CT — imaging-only smoke (36 labelled cases).
#
# Imaging: /mnt/d/nextcloud/data/medical-imaging/CPTAC-LUAD/radiology/CPTAC-LUAD
# Labels:  ../data/cptac_luad/labels_usable.csv
#   recoded from ajcc_stage (authors' delivered `label` column was almost all 0;
#   original file kept as labels_as_delivered.csv)
#   0 = Stage I (n=25), 1 = Stage II/III (n=11), -1 dropped (n=1 Not Reported)
#
# 36 cases / 5-fold => ~7 test samples per fold. This is a PATHWAY check, not a
# result. Do not quote these AUCs as a quantum-vs-classical finding.

modalities:
  - type: imaging_dicom
    root: /mnt/d/nextcloud/data/medical-imaging/CPTAC-LUAD/radiology/CPTAC-LUAD
    metadata_csv: /mnt/d/nextcloud/data/medical-imaging/CPTAC-LUAD/radiology/CPTAC-LUAD/metadata.csv
    want_modality: CT
    modality: imaging_ct
    window: [40, 400]
    mask_percentile: 60
    zscore_volume: false
    min_slices: 8

labels:
  path: /home/author/work/agents/shared/qml_in_multiomics/data/cptac_luad/labels_usable.csv
  id_column: case_id
  label_column: label

integration:
  max_missing: 0.2

run:
  models:
    logreg: {}
    svm_rbf: {}
    gbdt: {}
    qsvm_fidelity: {}
  n_splits: 5
  seed: 42
  normalize: zscore
  encoding_scale: pi
  select_k: 10
  selector: gbdt
