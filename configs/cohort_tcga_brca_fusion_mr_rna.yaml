# TCGA-BRCA MR + RNA-seq (5000 genes) Early Fusion on 136 paired cases
modalities:
  - type: matrix
    path: /home/author/work/agents/shared/qml_in_multiomics/repo/data/tcga_brca/brca_mr_features.csv
    id_column: case_id
    modality: imaging_mr

  - type: matrix
    path: /home/author/work/agents/shared/qml_in_multiomics/repo/data/tcga_brca/brca_rnaseq_5k.csv
    id_column: case_id
    modality: transcriptomics

labels:
  path: /home/author/work/agents/shared/qml_in_multiomics/repo/data/tcga_brca/labels_brca_mr_clean.csv
  id_column: case_id
  label_column: stage_binary

run:
  models:
    logreg: {}
    svm_rbf: {}
    gbdt: {}
    qsvm_fidelity: {}
  n_splits: 5
  seed: 42
  normalize: zscore
  encoding_scale: pi
  select_k: 10
  selector: gbdt
  # Exact 5 + 5 per-fold selection; prevents the 5000-feature RNA block from
  # silently displacing every MR radiomics feature.
  modality_quotas:
    imaging_mr: 5
    transcriptomics: 5
