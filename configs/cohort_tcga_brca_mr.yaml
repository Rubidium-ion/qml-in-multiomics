# TCGA-BRCA MR-only baseline on 126 stage-labelled cases
#
# 128 subjects with MR on disk, 126 with reported AJCC pathologic stage.
# Binary task: Early (Stage I/IA, n=31) vs Advanced (Stage II/III, n=95).
# MR intensities are arbitrary units; adapter z-scores each volume.

modalities:
  - type: imaging_dicom
    root: /mnt/d/nextcloud/data/medical-imaging/TCGA-BRCA/radiology/TCGA-BRCA
    metadata_csv: /mnt/d/nextcloud/data/medical-imaging/TCGA-BRCA/radiology/TCGA-BRCA/metadata.csv
    want_modality: MR
    modality: imaging_mr
    zscore_volume: true
    min_slices: 8

labels:
  path: /home/author/work/agents/shared/qml_in_multiomics/repo/data/tcga_brca/labels_mr_stage.csv
  id_column: case_id
  label_column: label

run:
  models:
    logreg: {}
    svm_rbf: {}
    gbdt: {}
    qsvm_fidelity: {}
  n_splits: 5
  seed: 42
  normalize: zscore
  encoding_scale: pi
  select_k: 10
  selector: gbdt
