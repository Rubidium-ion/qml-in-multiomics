# CPTAC-LUAD CT + RNA fusion — same 36 labelled cases.
#
# Alignment is by case_id. fuse() refuses positional joins.
# After the run, check results.selection.modality_selection_counts — if all 10
# selected features come from one block, the fusion claim is unsupported.

modalities:
  - type: imaging_dicom
    root: /mnt/d/nextcloud/data/medical-imaging/CPTAC-LUAD/radiology/CPTAC-LUAD
    metadata_csv: /mnt/d/nextcloud/data/medical-imaging/CPTAC-LUAD/radiology/CPTAC-LUAD/metadata.csv
    want_modality: CT
    modality: imaging_ct
    window: [40, 400]
    mask_percentile: 60
    zscore_volume: false
    min_slices: 8

  - type: transcriptomics
    path: /home/author/work/agents/shared/qml_in_multiomics/data/cptac_luad/rnaseq_tpm.csv
    modality: transcriptomics
    log1p: true
    top_var_genes: 2000

labels:
  path: /home/author/work/agents/shared/qml_in_multiomics/data/cptac_luad/labels_usable.csv
  id_column: case_id
  label_column: label

integration:
  max_missing: 0.2

run:
  models:
    logreg: {}
    svm_rbf: {}
    gbdt: {}
    qsvm_fidelity: {}
  n_splits: 5
  seed: 42
  normalize: zscore
  encoding_scale: pi
  select_k: 10
  selector: gbdt
